<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Project</title>
        <script src="https://cdn.jsdelivr.net/npm/frappe-charts@1.2.4/dist/frappe-charts.min.iife.js"></script>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <div id="search_bar">
            <input type="text" id="search_input" placeholder="Search a city">
            <button id="search_button">Search</button>
            <button id="gps_button">Use my location</button>
        </div>

        <ul id="results"></ul>

        <div id="settings">
            <select id="favorites"><option value="">Favorites</option></select>
            <button id="add_favorite">Add to favorites</button>
            <select id="units"><option value="C">°C</option><option value="F">°F</option><option value="K">K</option></select>
        </div>
        <main>
            <section id="now" class="card"><p>Search a city to start</p></section>

            <section class="card"><h2>Next 24 hours</h2><div id="hourly"></div></section>

            <section class="card"><h2>Next 7 days</h2><div id="daily"></div></section>

            <section class="card">
                <h2>Providers compared</h2>
                <div id="chart"></div>
                <div id="compare"></div>
            </section>

        </main>
        
        <script src="script.js" defer></script>
    </body>
</html>
